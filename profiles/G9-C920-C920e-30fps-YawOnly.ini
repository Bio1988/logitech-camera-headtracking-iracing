[modules]
tracker-dll=neuralnet
filter-dll=accela
protocol-dll=freetrack

[proto-freetrack]
used-interfaces=0

[opentrack-ui]
x-source-index=6
y-source-index=6
z-source-index=6
pitch-source-index=6
roll-source-index=6
center-at-startup=true
use-system-tray=true
start-in-tray=false

[opentrack-mappings]
yaw-max-value=45
yaw-max-output-value=-180

[neuralnet-tracker]
camera-name=
force-resolution=1
force-fps=1
field-of-view=56
offset-fwd=200
offset-up=0
offset-right=0
use-mjpeg=true
num-threads=2
internal-filter-enabled=true
show-network-input=false
